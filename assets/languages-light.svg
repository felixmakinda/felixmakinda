<svg xmlns="http://www.w3.org/2000/svg" width="880" height="192" viewBox="0 0 880 192" role="img" aria-label="felixmakinda: languages">
<title>felixmakinda: languages</title>
<style>
  text { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; }
  .fade { opacity: 0; animation: fade .6s ease-out forwards; }
  .draw { stroke-dasharray: 2400; stroke-dashoffset: 2400; animation: draw 2.2s cubic-bezier(.16,1,.3,1) forwards; }
  .grow { transform-origin: left; transform: scaleX(0); animation: grow 1.4s cubic-bezier(.16,1,.3,1) forwards; }
  @keyframes fade { to { opacity: 1; } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes grow { to { transform: scaleX(1); } }
  @media (prefers-reduced-motion: reduce) { .fade, .draw, .grow { animation: none; opacity: 1; stroke-dashoffset: 0; transform: none; } }
</style>
<rect x="0.5" y="0.5" width="879" height="191" rx="14" fill="#ffffff" stroke="#e3e7e8"/>
<text x="32" y="42" font-size="17" font-weight="600" fill="#132128">Languages</text>
<text x="848" y="42" font-size="11" text-anchor="end" fill="#687176">27 repositories active in the last two years</text>
<clipPath id="bar"><rect x="32" y="62" width="816" height="10" rx="5"/></clipPath>
<rect x="32" y="62" width="816" height="10" rx="5" fill="#eef1f1"/>
<g clip-path="url(#bar)"><g class="grow"><rect x="32.0" y="62" width="385.6" height="10" fill="#3178c6"/><rect x="419.6" y="62" width="296.0" height="10" fill="#f2c12e"/><rect x="717.6" y="62" width="88.7" height="10" fill="#e76f00"/><rect x="808.3" y="62" width="29.3" height="10" fill="#8d99a6"/><rect x="839.5" y="62" width="6.5" height="10" fill="#7b42bc"/></g></g>
<g class="fade" style="animation-delay:0.30s"><circle cx="37.0" cy="100" r="5" fill="#3178c6"/><text x="50.0" y="104" font-size="13" fill="#132128">TypeScript <tspan fill="#687176">47.5%</tspan></text></g>
<g class="fade" style="animation-delay:0.38s"><circle cx="241.0" cy="100" r="5" fill="#f2c12e"/><text x="254.0" y="104" font-size="13" fill="#132128">Python <tspan fill="#687176">36.5%</tspan></text></g>
<g class="fade" style="animation-delay:0.46s"><circle cx="445.0" cy="100" r="5" fill="#e76f00"/><text x="458.0" y="104" font-size="13" fill="#132128">Java <tspan fill="#687176">11.1%</tspan></text></g>
<g class="fade" style="animation-delay:0.54s"><circle cx="649.0" cy="100" r="5" fill="#8d99a6"/><text x="662.0" y="104" font-size="13" fill="#132128">JavaScript <tspan fill="#687176">3.8%</tspan></text></g>
