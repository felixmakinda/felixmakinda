<svg xmlns="http://www.w3.org/2000/svg" width="880" height="164" viewBox="0 0 880 164" role="img" aria-label="felixmakinda: languages">
<title>felixmakinda: languages</title>
<style>
  text { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; }
  .fade { opacity: 0; animation: fade .6s ease-out forwards; }
  .draw { stroke-dasharray: 2400; stroke-dashoffset: 2400; animation: draw 2.2s cubic-bezier(.16,1,.3,1) forwards; }
  .grow { transform-origin: left; transform: scaleX(0); animation: grow 1.4s cubic-bezier(.16,1,.3,1) forwards; }
  @keyframes fade { to { opacity: 1; } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes grow { to { transform: scaleX(1); } }
  @media (prefers-reduced-motion: reduce) { .fade, .draw, .grow { animation: none; opacity: 1; stroke-dashoffset: 0; transform: none; } }
</style>
<rect x="0.5" y="0.5" width="879" height="163" rx="14" fill="#101c22" stroke="#1f3038"/>
<text x="32" y="42" font-size="17" font-weight="600" fill="#f0f5f4">Languages</text>
<text x="848" y="42" font-size="11" text-anchor="end" fill="#a1a6a9">8 repositories active in the last two years</text>
<clipPath id="bar"><rect x="32" y="62" width="816" height="10" rx="5"/></clipPath>
<rect x="32" y="62" width="816" height="10" rx="5" fill="#18272e"/>
<g clip-path="url(#bar)"><g class="grow"><rect x="32.0" y="62" width="396.5" height="10" fill="#f2c12e"/><rect x="430.5" y="62" width="341.6" height="10" fill="#3178c6"/><rect x="774.1" y="62" width="46.4" height="10" fill="#8d99a6"/><rect x="822.4" y="62" width="23.6" height="10" fill="#7b42bc"/></g></g>
<g class="fade" style="animation-delay:0.30s"><circle cx="37.0" cy="100" r="5" fill="#f2c12e"/><text x="50.0" y="104" font-size="13" fill="#f0f5f4">Python <tspan fill="#a1a6a9">48.8%</tspan></text></g>
<g class="fade" style="animation-delay:0.38s"><circle cx="241.0" cy="100" r="5" fill="#3178c6"/><text x="254.0" y="104" font-size="13" fill="#f0f5f4">TypeScript <tspan fill="#a1a6a9">42.1%</tspan></text></g>
<g class="fade" style="animation-delay:0.46s"><circle cx="445.0" cy="100" r="5" fill="#8d99a6"/><text x="458.0" y="104" font-size="13" fill="#f0f5f4">JavaScript <tspan fill="#a1a6a9">5.9%</tspan></text></g>
<g class="fade" style="animation-delay:0.54s"><circle cx="649.0" cy="100" r="5" fill="#7b42bc"/><text x="662.0" y="104" font-size="13" fill="#f0f5f4">Terraform (HCL) <tspan fill="#a1a6a9">3.1%</tspan></text></g>
<text x="32" y="140" font-size="10" fill="#a1a6a9">Each repository counts equally; notebooks, markup and vendored code are excluded.</text>
</svg>