name: Profile graphs

on:
  schedule:
    - cron: "17 3 * * *" # daily, 06:17 Nairobi time
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/profile-graphs.yml"]

permissions:
  contents: write

concurrency:
  group: profile-graphs
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build graphs
        env:
          # Optional PROFILE_TOKEN (read-only, all repositories) adds private
          # repositories to the language chart; otherwise public ones only.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: python scripts/build_graphs.py

      - name: Commit if changed
        run: |
          git add assets
          if git diff --cached --quiet; then
            echo "Graphs unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update profile graphs"
          git push
